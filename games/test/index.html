<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World Smiley</title>
    <!-- Loading Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .animate-bounce-slow {
            animation: bounce-slow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen flex items-center justify-center p-4">

    <main class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-2xl shadow-xl p-8 text-center border border-white/20 transform transition-all duration-300 hover:shadow-2xl">
        
        <div class="mb-6 flex justify-center">
            <div class="w-32 h-32 bg-amber-300 rounded-full flex items-center justify-center shadow-lg animate-bounce-slow border-4 border-amber-400 relative overflow-hidden group">
                <!-- Smiley face SVG asset representing the smiley face graphic -->
                <svg class="w-24 h-24 text-amber-900" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Eyes -->
                    <circle cx="35" cy="38" r="8" fill="currentColor"/>
                    <circle cx="65" cy="38" r="8" fill="currentColor"/>
                    <!-- Smile Path -->
                    <path d="M 30 55 Q 50 75 70 55" stroke="currentColor" stroke-width="8" stroke-linecap="round"/>
                </svg>
                <!-- Subtle shine reflection -->
                <div class="absolute top-2 left-4 w-6 h-4 bg-white/40 rounded-full transform -rotate-45"></div>
            </div>
        </div>

        <h1 class="text-4xl font-extrabold text-gray-800 tracking-tight mb-2">
            Hello, World! 👋
        </h1>
        <p class="text-gray-600 text-base mb-6">
            Welcome to your nicely styled project page complete with a custom smiley face graphic and clean CSS styling.
        </p>

        <button onclick="triggerGreeting()" class="w-full py-3 px-6 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-xl shadow-md hover:from-indigo-700 hover:to-purple-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all duration-200 transform active:scale-95">
            Spread Joy ✨
        </button>

        <div id="messageBox" class="mt-4 hidden p-3 bg-indigo-50 text-indigo-700 rounded-xl text-sm font-medium transition-all duration-300">
            Keep smiling! Have a wonderful day ahead. 😊
        </div>
    </main>

    <script>
        function triggerGreeting() {
            const msgBox = document.getElementById('messageBox');
            msgBox.classList.toggle('hidden');
            
            // Temporary scale pulse effect on smiley container
            const smiley = document.querySelector('.animate-bounce-slow');
            smiley.style.transform = 'scale(1.1)';
            setTimeout(() => {
                smiley.style.transform = 'scale(1)';
            }, 200);
        }
    </script>
</body>
</html>
