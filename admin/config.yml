backend:
  name: github
  repo: RihardsVitols/FoC
  branch: main
  base_url: https://decap-oauth.vercel.app

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "vcd_projects"
    label: "VCD Projects"
    folder: "content/projects"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Student Name / Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "hidden", default: "VCD" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Short Excerpt", name: "excerpt", widget: "text" }
      - label: "Full Project Details"
        name: "body"
        widget: "markdown"
        pattern: ['^(\s*\S+){1,300}\s*$', "Full description cannot exceed 300 words."]

  - name: "game_projects"
    label: "GAME Projects"
    folder: "content/projects"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Student Name / Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "hidden", default: "GAME" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Short Excerpt", name: "excerpt", widget: "text" }
      - label: "Full Project Details"
        name: "body"
        widget: "markdown"
        pattern: ['^(\s*\S+){1,300}\s*$', "Full description cannot exceed 300 words."]

  - name: "nmc_projects"
    label: "NMC Projects"
    folder: "content/projects"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Student Name / Author", name: "author", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "hidden", default: "NMC" }
      - { label: "Cover Image", name: "image", widget: "image" }
      - { label: "Short Excerpt", name: "excerpt", widget: "text" }
      - label: "Full Project Details"
        name: "body"
        widget: "markdown"
        pattern: ['^(\s*\S+){1,300}\s*$', "Full description cannot exceed 300 words."]
