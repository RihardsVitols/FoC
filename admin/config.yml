backend:
  name: github
  repo: RihardsVitols/FoC
  branch: main
  base_url: https://decap-oauth.vercel.app

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "vcd_projects"
    label: "VCD Projects"
    folder: "content/projects"
    filter: { field: "category", value: "VCD" }
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sortable_fields: ["title", "author", "date"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Student Name / Author", name: "author", widget: "string" }
      - { label: "Date created", name: "date", widget: "datetime", format: "YYYY", dateFormat: "YYYY", timeFormat: false }
      - { label: "Category", name: "category", widget: "hidden", default: "VCD" }
      - { label: "Cover Image (JPG, PNG, GIF, WEBP)", name: "image", widget: "image", required: false }
      - { label: "Video URL (YouTube, Vimeo, or MP4)", name: "video", widget: "string", required: false }
      - { label: "PDF Document", name: "pdf", widget: "file", required: false, media_library: { allow_multiple: false } }
      - { label: "PDF Cover Screenshot", name: "pdf_cover", widget: "image", required: false }
      - { label: "Technic or materials", name: "excerpt", widget: "text" }
      - label: "Full Project Details"
        name: "body"
        widget: "markdown"
        pattern: ['^(\s*\S+){1,150}\s*$', "Full description cannot exceed 150 words."]

  - name: "game_projects"
    label: "GAME Projects"
    folder: "content/projects"
    filter: { field: "category", value: "GAME" }
