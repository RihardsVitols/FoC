backend:
  name: github
  repo: RihardsVitols/FoC
  branch: main
  base_url: https://decap-oauth.vercel.app

media_folder: "images/uploads"
public_folder: "images/uploads"

collections:
  - name: "vcd_projects"
    label: "VCD Projects"
    folder: "content/projects"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title and Year", name: "title", widget: "string" }
      - { label: "Student Name / Author", name: "author", widget: "string" }
      - { label: "Date created", name: "date", widget: "datetime", format: "YYYY", dateFormat: "YYYY", timeFormat: false }
      - { label: "Category", name: "category", widget: "hidden", default: "VCD" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Video URL (YouTube, Vimeo, or MP4)", name: "video", widget: "string", required: false }
      - { label: "Technic or materials", name: "excerpt", widget: "text" }
      - label: "Full Project Details"
        name: "body"
        widget: "markdown"
        pattern: ['^(\s*\S+){1,150}\s*$', "Full description cannot exceed 150 words."]

  - name: "game_projects"
    label: "GAME Projects"
    folder: "content/projects"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title and Year", name: "title", widget: "string" }
      - { label: "Student Name / Author", name: "author", widget: "string" }
      - { label: "Date created", name: "date", widget: "datetime", format: "YYYY", dateFormat: "YYYY", timeFormat: false }
      - { label: "Category", name: "category", widget: "hidden", default: "GAME" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Video URL (YouTube, Vimeo, or MP4)", name: "video", widget: "string", required: false }
      - { label: "Technic or materials", name: "excerpt", widget: "text" }
      - label: "Full Project Details"
        name: "body"
        widget: "markdown"
        pattern: ['^(\s*\S+){1,150}\s*$', "Full description cannot exceed 150 words."]

  - name: "nmc_projects"
    label: "NMC Projects"
    folder: "content/projects"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title and Year", name: "title", widget: "string" }
      - { label: "Student Name / Author", name: "author", widget: "string" }
      - { label: "Date created", name: "date", widget: "datetime", format: "YYYY", dateFormat: "YYYY", timeFormat: false }
      - { label: "Category", name: "category", widget: "hidden", default: "NMC" }
      - { label: "Cover Image", name: "image", widget: "image", required: false }
      - { label: "Video URL (YouTube, Vimeo, or MP4)", name: "video", widget: "string", required: false }
      - { label: "Technic or materials", name: "excerpt", widget: "text" }
      - label: "Full Project Details"
        name: "body"
        widget: "markdown"
        pattern: ['^(\s*\S+){1,150}\s*$', "Full description cannot exceed 150 words."]
