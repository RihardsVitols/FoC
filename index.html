<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARUCAD | Faculty of Communication</title>

    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Link external CSS -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Lightbox Modal Overlay Styles */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            object-fit: contain;
        }

        .image-modal .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 35px;
            font-weight: bold;
            cursor: pointer;
        }

        .image-container img {
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .image-container img:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand">
                <img src="images/logo.png" alt="ARUCAD Logo" class="site-logo">
                <span class="site-title">ARUCAD | Faculty of Communication</span>
            </div>
            <nav class="filter-container">
                <button class="filter-btn active" onclick="filterProjects('ALL', this)">ALL</button>
                <button class="filter-btn" onclick="filterProjects('VCD', this)">VCD</button>
                <button class="filter-btn" onclick="filterProjects('GAME', this)">GAME</button>
                <button class="filter-btn" onclick="filterProjects('NMC', this)">NMC</button>
            </nav>
        </header>

        <main id="portfolio-grid" class="portfolio-grid">
            <p class="loading-text">Loading projects...</p>
        </main>

        <footer>
            <p>&copy; ARUCAD Faculty of Communication | 2026</p>
        </footer>
    </div>

    <!-- Unified Lightbox Modal Overlay for Images & PDFs -->
    <div id="mediaModal" class="image-modal" onclick="closeModal()">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <div id="modalContentContainer" class="modal-body-container" onclick="event.stopPropagation()">
            <!-- Content dynamically injected here -->
        </div>
    </div>

    <!-- Link External JavaScript -->
    <script src="scripts.js"></script>
</body>
</html>
