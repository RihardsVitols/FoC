<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARUCAD | Faculty of Communication</title>

    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Fancybox 5 CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css" />
    <script src="https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js"></script>

    <!-- Meshopt Decoder -->
    <script src="https://cdn.jsdelivr.net/npm/meshoptimizer@0.19.0/meshopt_decoder.js"></script>

    <!-- Pre-assign MeshoptDecoder for model-viewer / GLTFLoader -->
    <script>
        if (typeof MeshoptDecoder !== 'undefined') {
            window.MeshoptDecoder = MeshoptDecoder;
        }
    </script>

    <!-- Google <model-viewer> -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <!-- Link external CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="brand">
                <img src="images/logo.png" alt="ARUCAD Logo" class="site-logo">
                <span class="site-title">ARUCAD | Faculty of Communication</span>
            </div>
            <nav class="filter-container">
                <button class="filter-btn active" onclick="filterProjects('ALL', this)">ALL</button>
                <button class="filter-btn" onclick="filterProjects('VCD', this)">VCD</button>
                <button class="filter-btn" onclick="filterProjects('GAME', this)">GAME</button>
                <button class="filter-btn" onclick="filterProjects('NMC', this)">NMC</button>
            </nav>
        </header>

        <main id="portfolio-grid" class="portfolio-grid">
            <p class="loading-text">Loading projects...</p>
        </main>

        <footer>
            <p>&copy; ARUCAD Faculty of Communication | 2026</p>
        </footer>
    </div>

    <!-- External Application Script -->
    <script src="scripts.js"></script>
</body>
</html>
